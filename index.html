<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Meus Treinos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root{
      --bg:#0a0a0b; --bg2:#0f0f11; --card:#131316; --card2:#1b1b1f; --line:#2a2a30;
      --txt:#f2f2f4; --muted:#8a8a92;
      --red:#e10600; --red2:#ff2a1f; --redglow:rgba(225,6,0,.45); --redtint:rgba(225,6,0,.12); --redline:rgba(225,6,0,.30);
      --warn:#ffb648; --radius:14px;
    }
    :root[data-mode="light"]{
      --bg:#eceef3; --bg2:#e3e6ee; --card:#ffffff; --card2:#f1f3f8; --line:#d7dbe4;
      --txt:#16171c; --muted:#6a7080;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0; padding:0;}
    body{
      background:var(--bg); color:var(--txt);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      padding-bottom:env(safe-area-inset-bottom); overscroll-behavior-y:contain;
    }
    body::before{
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:
        radial-gradient(120% 60% at 50% -10%, var(--redtint), transparent 60%),
        radial-gradient(80% 50% at 100% 100%, var(--redtint), transparent 60%);
    }
    header{
      position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
      padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
      display:flex; align-items:center; gap:10px; min-height:56px;
    }
    header .icon-btn{
      background:var(--card2); border:1px solid var(--line); color:var(--txt);
      width:40px; height:40px; border-radius:11px; font-size:20px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    header .icon-btn:active{background:var(--red); border-color:var(--red);}
    header .back{display:none; font-size:22px;}
    header h1{font-size:16px; margin:0; font-weight:800; flex:1; line-height:1.15;
      text-transform:uppercase; letter-spacing:1px;}
    header h1 small{display:block; font-size:11px; color:var(--red2); font-weight:700;
      letter-spacing:2px; margin-top:3px; text-transform:uppercase;}
    main{padding:16px; max-width:640px; margin:0 auto;}

    /* HERO */
    .hero{position:relative; border-radius:18px; overflow:hidden; margin-bottom:16px;
      border:1px solid var(--line); box-shadow:0 0 40px -12px var(--redglow); background:#000;}
    .hero img{width:100%; height:300px; object-fit:cover; object-position:50% 18%; display:block;
      filter:contrast(1.08) saturate(1.05) brightness(.94);}
    .hero .grad{position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(10,10,11,.15) 0%, rgba(10,10,11,.05) 40%, rgba(10,10,11,.92) 100%),
                 linear-gradient(90deg, var(--redtint), transparent 55%);}
    .hero .content{position:absolute; left:0; right:0; bottom:0; padding:18px;}
    .hero .kicker{display:inline-block; font-size:11px; font-weight:800; letter-spacing:2.5px;
      color:#fff; background:var(--red); padding:4px 10px; border-radius:6px;
      text-transform:uppercase; margin-bottom:10px; box-shadow:0 0 18px -2px var(--redglow);}
    .hero h2{margin:0; font-size:30px; font-weight:900; line-height:.98; color:#fff;
      text-transform:uppercase; letter-spacing:-.5px; text-shadow:0 2px 20px rgba(0,0,0,.7);}
    .hero h2 b{color:var(--red2);}
    .hero p{margin:6px 0 0; font-size:12.5px; color:#cfcfd4; font-weight:600;}
    .hero .credit{position:absolute; top:8px; right:10px; font-size:9px; color:rgba(255,255,255,.55);
      background:rgba(0,0,0,.4); padding:2px 7px; border-radius:99px;}

    /* STATS */
    .stats{display:flex; gap:10px; margin-bottom:16px;}
    .stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      padding:14px 12px; text-align:center; position:relative; overflow:hidden;}
    .stat .v{font-size:24px; font-weight:900; line-height:1;}
    .stat .v .em{font-size:18px;}
    .stat .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-top:5px; font-weight:700;}
    .stat.accent{border-color:var(--redline);}
    .stat.accent .v{color:var(--red2);}
    .link-hist{display:block; width:100%; text-align:center; background:transparent; border:1px solid var(--line);
      color:var(--muted); border-radius:11px; padding:11px; font-size:12px; cursor:pointer; margin-bottom:16px;
      text-transform:uppercase; letter-spacing:1px; font-weight:700;}
    .link-hist:active{border-color:var(--red); color:var(--red2);}

    .section-label{font-size:11px; letter-spacing:3px; color:var(--muted); font-weight:800;
      text-transform:uppercase; margin:0 2px 12px;}

    /* CARDS TREINO */
    .treino-card{position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      padding:18px; margin-bottom:12px; cursor:pointer; display:flex; align-items:center; gap:15px;
      transition:transform .1s, border-color .2s, box-shadow .2s; overflow:hidden;}
    .treino-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red);}
    .treino-card:active{transform:scale(.985); border-color:var(--red); box-shadow:0 0 24px -8px var(--redglow);}
    .treino-badge{width:52px; height:52px; border-radius:12px; flex-shrink:0; margin-left:4px;
      background:linear-gradient(135deg,var(--red2),color-mix(in srgb,var(--red) 55%, #000));
      display:flex; align-items:center; justify-content:center;
      font-size:23px; font-weight:900; color:#fff; box-shadow:0 0 18px -4px var(--redglow);}
    .treino-card .info{flex:1; min-width:0;}
    .treino-card .info h3{margin:0 0 3px; font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;}
    .treino-card .info p{margin:0; color:var(--muted); font-size:13px;}
    .treino-card .info .count{color:var(--red2); font-size:11px; margin-top:6px; font-weight:800; letter-spacing:1px; text-transform:uppercase;}
    .treino-card .info .count .last{color:var(--muted);}
    .treino-card .info .count .today{color:#16c784;}
    .treino-card .chev{color:var(--red); font-size:24px; font-weight:700;}

    /* PROGRESS */
    .progress-wrap{margin-bottom:18px;}
    .progress-top{display:flex; justify-content:space-between; font-size:11px; font-weight:800;
      letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:7px;}
    .progress-top b{color:var(--red2);}
    .progress-bar{height:7px; background:var(--card2); border-radius:99px; overflow:hidden;}
    .progress-bar > div{height:100%; background:linear-gradient(90deg,var(--red),var(--red2));
      width:0%; transition:width .3s; box-shadow:0 0 12px -1px var(--redglow);}

    /* EXERCÍCIO */
    .ex{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      margin-bottom:14px; overflow:hidden; transition:border-color .2s;}
    .ex.done{border-color:var(--red);}
    .ex-media{width:100%; aspect-ratio:16/11; background:#fff; position:relative; overflow:hidden;}
    .ex-img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; background:#fff;}
    .ex-media .f1{opacity:0;}
    .ex-media .f1.anim{animation:exflip 1.6s linear infinite;}
    @keyframes exflip{0%,48%{opacity:0} 52%,100%{opacity:1}}
    .ex-media .frame-dot{position:absolute; bottom:8px; right:10px; font-size:10px; color:#fff; font-weight:700;
      background:var(--red); padding:3px 8px; border-radius:99px; letter-spacing:.5px;}
    .placeholder{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--muted);
      font-size:12px; text-align:center; padding:10px; gap:8px; flex-direction:column; background:var(--card2);}
    .ex-body{padding:15px;}
    .ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
    .ex-head h3{margin:0; font-size:15.5px; line-height:1.3; font-weight:800;}
    .tag{font-size:10px; font-weight:800; color:var(--red2); background:var(--redtint);
      border:1px solid var(--redline); padding:3px 9px; border-radius:99px; white-space:nowrap;
      align-self:flex-start; text-transform:uppercase; letter-spacing:.5px;}
    .ex-meta{display:flex; gap:20px; margin:13px 0;}
    .ex-meta .m span{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
    .ex-meta .m strong{font-size:17px; margin-top:2px; display:block; font-weight:800;}
    .obs{font-size:12.5px; color:var(--muted); background:var(--card2); border-left:2px solid var(--red);
      border-radius:8px; padding:10px 12px; margin:0 0 13px; line-height:1.45;}

    .carga{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
    .carga label{font-size:12px; color:var(--muted); flex-shrink:0; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
    .carga input{flex:1; background:var(--card2); border:1px solid var(--line); color:var(--txt);
      border-radius:9px; padding:10px 12px; font-size:15px; min-width:0; font-weight:600;}
    .carga input:focus{outline:none; border-color:var(--red); box-shadow:0 0 0 3px var(--redtint);}
    .carga .unit{color:var(--muted); font-size:12px; font-weight:700;}
    .lastload{font-size:11.5px; color:var(--muted); margin:0 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
    .lastload .up{color:#16c784; font-weight:800;}
    .lastload .down{color:var(--red2); font-weight:800;}
    .lastload .same{color:var(--muted); font-weight:800;}
    .lastload button{background:none; border:none; color:var(--red2); font-size:11.5px; cursor:pointer; font-weight:700; padding:0; text-decoration:underline; margin-left:auto;}
    .histbox{background:var(--card2); border-radius:8px; padding:8px 12px; margin:0 0 12px; font-size:12px; display:none;}
    .histbox.show{display:block;}
    .histbox .row{display:flex; justify-content:space-between; padding:3px 0; color:var(--muted);}
    .histbox .row b{color:var(--txt);}
    .histbox .empty{color:var(--muted);}

    .series{display:flex; gap:7px; margin-bottom:12px;}
    .serie-btn{flex:1; min-width:0; background:var(--card2); border:1px solid var(--line);
      color:var(--muted); border-radius:9px; padding:11px 2px; font-size:11px; font-weight:700;
      cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; transition:.15s;
      text-transform:uppercase; letter-spacing:.3px;}
    .serie-btn .n{font-size:15px; color:var(--txt); font-weight:800;}
    .serie-btn.done{background:var(--red); border-color:var(--red); color:#fff; box-shadow:0 0 16px -4px var(--redglow);}
    .serie-btn.done .n{color:#fff;}

    .rest-btn{width:100%; background:var(--card2); border:1px solid var(--line); color:var(--txt);
      border-radius:11px; padding:13px; font-size:13.5px; font-weight:800; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:8px; text-transform:uppercase; letter-spacing:.5px;}
    .rest-btn:active{background:var(--red); border-color:var(--red);}

    .conclude-btn{width:100%; background:linear-gradient(135deg,var(--red2),var(--red)); border:none; color:#fff;
      border-radius:12px; padding:16px; font-size:15px; font-weight:900; cursor:pointer; margin:4px 0 8px;
      text-transform:uppercase; letter-spacing:.5px; box-shadow:0 0 22px -6px var(--redglow);}
    .conclude-btn.done{background:transparent; border:1px solid #16c784; color:#16c784; box-shadow:none;}
    .conclude-btn:active{transform:scale(.99);}
    .reset-btn{width:100%; background:transparent; border:1px solid var(--line); color:var(--muted);
      border-radius:11px; padding:13px; font-size:12.5px; cursor:pointer; margin-top:2px;
      text-transform:uppercase; letter-spacing:1px; font-weight:700;}
    .reset-btn:active{border-color:var(--red); color:var(--red2);}

    .install-tip{background:var(--redtint); border:1px solid var(--redline); border-radius:11px;
      padding:12px 14px; font-size:12.5px; color:var(--muted); margin-bottom:16px; line-height:1.5;
      display:flex; gap:10px; align-items:flex-start;}
    .install-tip b{color:var(--txt);}
    .install-tip button{margin-left:auto; background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer;}

    /* HISTÓRICO VIEW */
    .hist-day{margin-bottom:14px;}
    .hist-day .date{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; font-weight:800; margin-bottom:8px;}
    .hist-item{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
      display:flex; align-items:center; gap:12px; margin-bottom:8px;}
    .hist-item .b{width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--red2),color-mix(in srgb,var(--red) 55%,#000));
      display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; flex-shrink:0;}
    .hist-item .t{flex:1;} .hist-item .t h4{margin:0; font-size:14px; font-weight:800;}
    .hist-item .t p{margin:2px 0 0; font-size:12px; color:var(--muted);}
    .hist-item .del{background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer;}
    .empty-state{text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; line-height:1.6;}

    /* TIMER */
    .overlay{position:fixed; inset:0; z-index:100; background:color-mix(in srgb, var(--bg) 92%, #000);
      backdrop-filter:blur(8px); display:none; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:24px;}
    .overlay.show{display:flex;}
    .timer-ring{position:relative; width:240px; height:240px; filter:drop-shadow(0 0 24px var(--redglow));}
    .timer-ring svg{transform:rotate(-90deg);}
    .timer-ring .num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:56px; font-weight:900; font-variant-numeric:tabular-nums;}
    .timer-label{color:var(--muted); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:2px; text-align:center;}
    .timer-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
    .timer-actions button, .sheet button.act{background:var(--card2); border:1px solid var(--line); color:var(--txt);
      border-radius:11px; padding:14px 20px; font-size:14px; font-weight:800; cursor:pointer;
      text-transform:uppercase; letter-spacing:.5px;}
    .timer-actions .primary{background:var(--red); border-color:var(--red);}
    .timer-actions .stop{background:transparent; border-color:var(--line); color:var(--muted);}

    /* SETTINGS SHEET */
    .sheet-wrap{position:fixed; inset:0; z-index:110; display:none; align-items:flex-end; justify-content:center;
      background:rgba(0,0,0,.5);}
    .sheet-wrap.show{display:flex;}
    .sheet{width:100%; max-width:640px; background:var(--bg2); border:1px solid var(--line);
      border-radius:20px 20px 0 0; padding:20px 18px calc(env(safe-area-inset-bottom) + 24px); animation:slideup .2s ease;}
    @keyframes slideup{from{transform:translateY(30px); opacity:.6} to{transform:none; opacity:1}}
    .sheet h3{margin:0 0 4px; font-size:18px; font-weight:900; text-transform:uppercase; letter-spacing:.5px;}
    .sheet .sub{color:var(--muted); font-size:12px; margin:0 0 20px;}
    .sheet .grp{margin-bottom:20px;}
    .sheet .grp > label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; font-weight:800; display:block; margin-bottom:10px;}
    .swatches{display:flex; gap:12px;}
    .swatch{width:44px; height:44px; border-radius:50%; cursor:pointer; border:3px solid transparent; position:relative;}
    .swatch.sel{border-color:var(--txt);}
    .swatch.sel::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:18px; text-shadow:0 1px 3px rgba(0,0,0,.5);}
    .modes{display:flex; gap:10px;}
    .mode-btn{flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:11px;
      padding:14px; font-size:14px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
    .mode-btn.sel{border-color:var(--red); background:var(--redtint); color:var(--red2);}
    .sheet .close{width:100%; background:var(--red); border:none; color:#fff; border-radius:12px; padding:15px; font-size:15px; font-weight:900; cursor:pointer; text-transform:uppercase; letter-spacing:.5px;}

    /* TOAST */
    #toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%) translateY(20px);
      background:var(--card); border:1px solid var(--red); color:var(--txt); padding:14px 20px; border-radius:12px;
      font-size:14px; font-weight:700; z-index:200; opacity:0; pointer-events:none; transition:.25s; box-shadow:0 8px 30px -8px var(--redglow); max-width:90%; text-align:center;}
    #toast.show{opacity:1; transform:translateX(-50%);}
  </style>
</head>
<body>
  <header>
    <button class="icon-btn back" id="backBtn" aria-label="Voltar">‹</button>
    <h1 id="title">Meus Treinos<small id="subtitle">Sem desculpas</small></h1>
    <button class="icon-btn" id="gearBtn" aria-label="Configurações">⚙</button>
  </header>
  <main id="app"></main>

  <!-- Timer -->
  <div class="overlay" id="timerOverlay">
    <div class="timer-ring">
      <svg width="240" height="240">
        <circle cx="120" cy="120" r="108" fill="none" stroke="var(--card2)" stroke-width="14"/>
        <circle id="timerCircle" cx="120" cy="120" r="108" fill="none" stroke="var(--red)" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="678.5" stroke-dashoffset="0"/>
      </svg>
      <div class="num" id="timerNum">0:00</div>
    </div>
    <div class="timer-label" id="timerLabel">Descanso</div>
    <div class="timer-actions">
      <button id="timerAdd">+15s</button>
      <button class="primary" id="timerToggle">Pausar</button>
      <button class="stop" id="timerStop">Encerrar</button>
    </div>
  </div>

  <!-- Configurações -->
  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet">
      <h3>Configurações</h3>
      <p class="sub">Deixe o app com a sua cara.</p>
      <div class="grp">
        <label>Cor de destaque</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="grp">
        <label>Tema</label>
        <div class="modes">
          <button class="mode-btn" data-mode="dark" id="modeDark">🌙 Escuro</button>
          <button class="mode-btn" data-mode="light" id="modeLight">☀️ Claro</button>
        </div>
      </div>
      <button class="close" id="sheetClose">Pronto</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="treinos.js"></script>
  <script>
  (function(){
    const app = document.getElementById('app');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const backBtn = document.getElementById('backBtn');
    const store = {
      get(k, def){ try{ const v=localStorage.getItem('treino_'+k); return v===null?def:JSON.parse(v); }catch(e){ return def; } },
      set(k, v){ localStorage.setItem('treino_'+k, JSON.stringify(v)); }
    };
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const num = s => { const n=parseFloat(String(s).replace(',','.')); return isNaN(n)?null:n; };
    function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    const today = () => fmtDate(new Date());
    function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

    /* ---------- TEMA ---------- */
    const THEMES = {
      vermelho:{red:'#e10600',red2:'#ff2a1f',glow:'rgba(225,6,0,.45)',tint:'rgba(225,6,0,.12)',line:'rgba(225,6,0,.30)'},
      azul:    {red:'#1f6fff',red2:'#4d90ff',glow:'rgba(31,111,255,.45)',tint:'rgba(31,111,255,.12)',line:'rgba(31,111,255,.30)'},
      verde:   {red:'#10b768',red2:'#22d67e',glow:'rgba(16,183,104,.45)',tint:'rgba(16,183,104,.12)',line:'rgba(16,183,104,.30)'},
      roxo:    {red:'#7a3cff',red2:'#9a5cff',glow:'rgba(122,60,255,.45)',tint:'rgba(122,60,255,.12)',line:'rgba(122,60,255,.30)'},
      dourado: {red:'#d99a00',red2:'#ffc21f',glow:'rgba(217,154,0,.5)',tint:'rgba(217,154,0,.14)',line:'rgba(217,154,0,.32)'}
    };
    function getTheme(){ return store.get('theme', {accent:'vermelho', mode:'dark'}); }
    function applyTheme(){
      const t=getTheme(); const c=THEMES[t.accent]||THEMES.vermelho; const r=document.documentElement.style;
      r.setProperty('--red',c.red); r.setProperty('--red2',c.red2); r.setProperty('--redglow',c.glow);
      r.setProperty('--redtint',c.tint); r.setProperty('--redline',c.line);
      document.documentElement.setAttribute('data-mode', t.mode==='light'?'light':'dark');
      document.querySelector('meta[name=theme-color]').setAttribute('content', t.mode==='light'?'#eceef3':'#0a0a0a');
    }

    /* ---------- SESSÕES / HISTÓRICO ---------- */
    function sessions(){ return store.get('sessions', []); }
    function concludedToday(id){ return sessions().some(s=>s.id===id && s.d===today()); }
    function addSession(id){
      const s=sessions(); if(s.some(x=>x.id===id && x.d===today())) return false;
      s.push({id, d:today(), ts:Date.now()}); store.set('sessions', s); return true;
    }
    function removeSession(id, d, ts){
      store.set('sessions', sessions().filter(s=>!(s.id===id && s.d===d && s.ts===ts)));
    }
    function streak(){
      const set=new Set(sessions().map(s=>s.d)); if(!set.size) return 0;
      let n=0; let d=new Date();
      if(!set.has(fmtDate(d))){ d.setDate(d.getDate()-1); if(!set.has(fmtDate(d))) return 0; }
      while(set.has(fmtDate(d))){ n++; d.setDate(d.getDate()-1); }
      return n;
    }
    function weekCount(){ const now=Date.now(); return sessions().filter(s=> now - s.ts < 7*864e5).length; }
    function lastDone(id){
      const ds=sessions().filter(s=>s.id===id).map(s=>s.d).sort(); if(!ds.length) return null;
      const last=ds[ds.length-1]; const diff=Math.round((new Date(today())-new Date(last))/864e5);
      return {last, diff};
    }

    /* ---------- HISTÓRICO DE CARGA ---------- */
    function hist(id,i){ return store.get('hist_'+id+'_'+i, []); }
    function recordLoad(id,i,val){
      const kg=num(val); if(kg===null) return;
      let h=hist(id,i); const d=today();
      if(h.length && h[h.length-1].d===d) h[h.length-1].kg=kg; else h.push({d, kg});
      if(h.length>60) h=h.slice(-60);
      store.set('hist_'+id+'_'+i, h);
    }
    function prevLoad(id,i){ // último registro de dia anterior a hoje
      const h=hist(id,i); for(let k=h.length-1;k>=0;k--){ if(h[k].d!==today()) return h[k]; } return null;
    }

    /* ---------- HOME ---------- */
    function renderHome(){
      backBtn.style.display='none';
      titleEl.childNodes[0].nodeValue='Meus Treinos';
      subtitleEl.textContent='Sem desculpas';
      const st=streak();
      let html = `
        <section class="hero">
          <img src="cbum2024.jpg" alt="Chris Bumstead - Mr. Olympia 2024" onerror="if(this.src.indexOf('cbum.jpg')<0){this.src='cbum.jpg';}else{this.style.height='150px';}">
          <span class="credit">CBUM · Mr. Olympia 2024</span>
          <div class="grad"></div>
          <div class="content">
            <span class="kicker">6× Mr. Olympia · Classic Physique</span>
            <h2>SEM <b>MODO FÁCIL</b></h2>
            <p>Disciplina bate motivação. Bora treinar. 🔥</p>
          </div>
        </section>
        <div class="stats">
          <div class="stat accent"><div class="v">${st}<span class="em">🔥</span></div><div class="l">Sequência (dias)</div></div>
          <div class="stat"><div class="v">${weekCount()}</div><div class="l">Treinos na semana</div></div>
          <div class="stat"><div class="v">${sessions().length}</div><div class="l">Total</div></div>
        </div>
        <button class="link-hist" onclick="location.hash='#/hist'">📅 Ver histórico completo</button>
        <div class="section-label">Escolha o treino de hoje</div>`;
      if(!store.get('hideInstall', false)){
        html += `<div class="install-tip" id="installTip"><span>📲</span>
          <div><b>Instale na tela inicial:</b> menu do navegador → <b>"Adicionar à tela inicial"</b>. Abre como app e funciona offline.</div>
          <button onclick="__hideInstall()">×</button></div>`;
      }
      TREINOS.forEach(t=>{
        const done=concludedToday(t.id); const ld=lastDone(t.id);
        let statusLabel;
        if(done) statusLabel = `<span class="today">✓ Feito hoje</span>`;
        else if(ld) statusLabel = `<span class="last">Último: ${ld.diff===0?'hoje':ld.diff===1?'ontem':'há '+ld.diff+' dias'}</span>`;
        else statusLabel = `${t.exercicios.length} exercícios`;
        html += `<div class="treino-card" onclick="__openTreino('${t.id}')">
          <div class="treino-badge">${t.id}</div>
          <div class="info"><h3>${esc(t.nome)}</h3><p>${esc(t.foco)}</p>
            <div class="count">${statusLabel}</div></div>
          <div class="chev">›</div></div>`;
      });
      app.innerHTML = html; window.scrollTo(0,0);
    }
    window.__hideInstall = function(){ store.set('hideInstall', true); const t=document.getElementById('installTip'); if(t) t.remove(); };

    /* ---------- HISTÓRICO (tela) ---------- */
    function renderHistory(){
      backBtn.style.display='flex';
      titleEl.childNodes[0].nodeValue='Histórico';
      subtitleEl.textContent='Seus treinos concluídos';
      const s=sessions().slice().sort((a,b)=>b.ts-a.ts);
      let html = `<div class="stats">
        <div class="stat accent"><div class="v">${streak()}<span class="em">🔥</span></div><div class="l">Sequência</div></div>
        <div class="stat"><div class="v">${weekCount()}</div><div class="l">Na semana</div></div>
        <div class="stat"><div class="v">${s.length}</div><div class="l">Total</div></div></div>`;
      if(!s.length){
        html += `<div class="empty-state">Nenhum treino concluído ainda.<br>Conclua um treino e ele aparece aqui. 💪</div>`;
      } else {
        let curDay=null;
        s.forEach(x=>{
          if(x.d!==curDay){ if(curDay!==null) html+='</div>'; curDay=x.d; html+=`<div class="hist-day"><div class="date">${fmtDayLabel(x.d)}</div>`; }
          const t=TREINOS.find(tt=>tt.id===x.id);
          html+=`<div class="hist-item"><div class="b">${x.id}</div>
            <div class="t"><h4>${t?esc(t.nome):('Treino '+x.id)}</h4><p>${t?esc(t.foco):''}</p></div>
            <button class="del" onclick="__delSession('${x.id}','${x.d}',${x.ts})" aria-label="Remover">🗑️</button></div>`;
        });
        html+='</div>';
      }
      app.innerHTML=html; window.scrollTo(0,0);
    }
    function fmtDayLabel(d){
      const diff=Math.round((new Date(today())-new Date(d))/864e5);
      if(diff===0) return 'Hoje';
      if(diff===1) return 'Ontem';
      const p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0];
    }
    window.__delSession=function(id,d,ts){ removeSession(id,d,ts); renderHistory(); toast('Registro removido'); };

    /* ---------- TREINO ---------- */
    function renderTreino(id){
      const t = TREINOS.find(x=>x.id===id);
      if(!t){ location.hash=''; return; }
      backBtn.style.display='flex';
      titleEl.childNodes[0].nodeValue=t.nome;
      subtitleEl.textContent=t.foco;

      let html = `<div class="progress-wrap">
        <div class="progress-top"><span>Progresso</span><span id="progTxt"></span></div>
        <div class="progress-bar"><div id="progFill"></div></div></div>`;
      t.exercicios.forEach((ex, i)=>{
        const key = id+'_'+i;
        const cargaVal = store.get('carga_'+key, '');
        const seriesDone = store.get('series_'+key, []);
        const total = ex.series;
        let seriesHtml='';
        for(let s=0; s<total; s++){
          const on = seriesDone.includes(s);
          seriesHtml += `<button class="serie-btn ${on?'done':''}" onclick="__toggleSerie('${id}',${i},${s})">
            <span class="n">${s+1}ª</span>${on?'ok':'série'}</button>`;
        }
        const imgs = ex.imgs && ex.imgs.length ? ex.imgs : [];
        const frame1 = imgs.length>1
          ? `<img class="ex-img f1 anim" src="${imgs[1]}" alt="" loading="lazy" onerror="this.remove()"><span class="frame-dot">● execução</span>` : '';
        const mediaHtml = imgs.length
          ? `<div class="ex-media"><img class="ex-img f0" src="${imgs[0]}" alt="${esc(ex.nome)}" loading="lazy" onerror="__imgErr(this)">${frame1}</div>`
          : `<div class="ex-media"><div class="placeholder">${phSvg()}<span>Sem imagem</span></div></div>`;
        const lastHtml = lastLoadHtml(id, i, cargaVal);

        html += `<div class="ex ${seriesDone.length===total?'done':''}" id="ex_${key}">
          ${mediaHtml}
          <div class="ex-body">
            <div class="ex-head"><h3>${i+1}. ${esc(ex.nome)}</h3><span class="tag">${esc(ex.musculo||'')}</span></div>
            <div class="ex-meta">
              <div class="m"><span>Séries</span><strong>${ex.series}</strong></div>
              <div class="m"><span>Reps</span><strong>${esc(ex.reps)}</strong></div>
              <div class="m"><span>Descanso</span><strong>${ex.descanso}s</strong></div></div>
            ${ex.obs?`<p class="obs">💡 ${esc(ex.obs)}</p>`:''}
            <div class="carga"><label>Carga</label>
              <input type="text" inputmode="decimal" placeholder="ex: 20" value="${esc(cargaVal)}"
                onchange="__saveCarga('${id}',${i}, this.value)"><span class="unit">kg</span></div>
            <div class="lastload" id="last_${key}">${lastHtml}</div>
            <div class="histbox" id="hist_${key}"></div>
            <div class="series">${seriesHtml}</div>
            <button class="rest-btn" onclick="__rest('${id}',${i})">⏱️ Descanso ${ex.descanso}s</button>
          </div></div>`;
      });
      const done=concludedToday(id);
      html += `<button class="conclude-btn ${done?'done':''}" id="concludeBtn" onclick="__conclude('${id}')">
        ${done?'✓ Treino concluído hoje':'✅ Concluir treino de hoje'}</button>`;
      html += `<button class="reset-btn" onclick="__resetTreino('${id}')">↺ Zerar séries deste treino</button>`;
      app.innerHTML = html; updateProgress(id); window.scrollTo(0,0);
    }

    function lastLoadHtml(id,i,cargaVal){
      const p=prevLoad(id,i); if(!p) return `<span>Registre sua carga para acompanhar a evolução 📈</span>`;
      const cur=num(cargaVal); let trend='';
      if(cur!==null){
        if(cur>p.kg) trend=`<span class="up">↗ +${(cur-p.kg).toFixed(cur%1||p.kg%1?1:0)} kg</span>`;
        else if(cur<p.kg) trend=`<span class="down">↘ ${(cur-p.kg).toFixed(1)} kg</span>`;
        else trend=`<span class="same">→ igual</span>`;
      }
      return `<span>Última vez: <b>${p.kg} kg</b></span> ${trend}
        <button onclick="__toggleHist('${id}',${i})">histórico</button>`;
    }
    window.__toggleHist=function(id,i){
      const box=document.getElementById('hist_'+id+'_'+i); if(!box) return;
      if(box.classList.contains('show')){ box.classList.remove('show'); return; }
      const h=hist(id,i).slice().reverse();
      box.innerHTML = h.length ? h.map(e=>{const p=e.d.split('-'); return `<div class="row"><span>${p[2]}/${p[1]}</span><b>${e.kg} kg</b></div>`;}).join('')
        : `<div class="empty">Sem registros ainda.</div>`;
      box.classList.add('show');
    };

    function phSvg(){ return `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M6.5 8v8M17.5 8v8" stroke-linecap="round"/></svg>`; }
    window.__imgErr=function(img){ const m=img.closest('.ex-media'); if(m) m.innerHTML=`<div class="placeholder">${phSvg()}<span>Imagem indisponível</span></div>`; };

    window.__saveCarga=function(id,i,val){ store.set('carga_'+id+'_'+i, val); recordLoad(id,i,val);
      const el=document.getElementById('last_'+id+'_'+i); if(el) el.innerHTML=lastLoadHtml(id,i,val);
      const box=document.getElementById('hist_'+id+'_'+i); if(box) box.classList.remove('show');
    };
    window.__toggleSerie=function(id, exIdx, s){
      const key=id+'_'+exIdx; let done=store.get('series_'+key, []);
      done = done.includes(s) ? done.filter(x=>x!==s) : done.concat(s);
      store.set('series_'+key, done);
      const t=TREINOS.find(x=>x.id===id); const exEl=document.getElementById('ex_'+key);
      if(exEl){ exEl.querySelectorAll('.serie-btn').forEach((b,idx)=>{ const on=done.includes(idx); b.classList.toggle('done',on); b.lastChild.textContent=on?'ok':'série'; });
        exEl.classList.toggle('done', done.length===t.exercicios[exIdx].series); }
      updateProgress(id);
    };
    window.__resetTreino=function(id){ const t=TREINOS.find(x=>x.id===id); t.exercicios.forEach((ex,i)=>store.set('series_'+id+'_'+i, [])); renderTreino(id); toast('Séries zeradas'); };
    window.__conclude=function(id){
      // grava carga de hoje no histórico de cada exercício
      const t=TREINOS.find(x=>x.id===id);
      t.exercicios.forEach((ex,i)=>{ const v=store.get('carga_'+id+'_'+i,''); if(num(v)!==null) recordLoad(id,i,v); });
      const added=addSession(id);
      const btn=document.getElementById('concludeBtn');
      if(btn){ btn.classList.add('done'); btn.textContent='✓ Treino concluído hoje'; }
      toast(added?'💪 Treino concluído! Sequência: '+streak()+' dia'+(streak()>1?'s':''):'Já estava concluído hoje');
    };
    function updateProgress(id){
      const t=TREINOS.find(x=>x.id===id); let total=0, done=0;
      t.exercicios.forEach((ex,i)=>{ total+=ex.series; done+=store.get('series_'+id+'_'+i, []).length; });
      const fill=document.getElementById('progFill'); const txt=document.getElementById('progTxt');
      if(fill) fill.style.width=(total?(done/total*100):0)+'%';
      if(txt) txt.innerHTML=`<b>${done}</b> / ${total} séries`;
    }

    /* ---------- CRONÔMETRO ---------- */
    const overlay=document.getElementById('timerOverlay');
    const tNum=document.getElementById('timerNum'), tLabel=document.getElementById('timerLabel');
    const tCircle=document.getElementById('timerCircle'), tToggle=document.getElementById('timerToggle');
    const CIRC=2*Math.PI*108; let tInterval=null, tRemain=0, tTotal=0, tPaused=false;
    function fmt(s){ const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
    function drawTimer(){ tNum.textContent=fmt(tRemain); tCircle.style.strokeDashoffset=CIRC*(1-tRemain/tTotal);
      tCircle.setAttribute('stroke', tRemain<=5?'#ff2a1f':(tRemain<=10?'#ffb648':'var(--red)')); }
    window.__rest=function(id,i){ const t=TREINOS.find(x=>x.id===id); if(!t) return; const ex=t.exercicios[i]; if(!ex) return; __startTimer(ex.descanso, ex.nome); };
    window.__startTimer=function(sec, nome){ tTotal=tRemain=sec; tPaused=false; tLabel.textContent='Descanso · '+(nome||'');
      tToggle.textContent='Pausar'; tCircle.style.strokeDasharray=CIRC; overlay.classList.add('show'); drawTimer();
      clearInterval(tInterval); tInterval=setInterval(tick,1000); };
    function tick(){ if(tPaused) return; tRemain--; if(tRemain<=0){ zero(); return; } drawTimer(); }
    function zero(){ tRemain=0; drawTimer(); clearInterval(tInterval); tNum.textContent='0:00';
      tLabel.textContent='Acabou o descanso! 🔥'; beep(); vibrate(); setTimeout(()=>overlay.classList.remove('show'),1200); }
    tToggle.onclick=function(){ tPaused=!tPaused; this.textContent=tPaused?'Retomar':'Pausar'; };
    document.getElementById('timerAdd').onclick=function(){ tRemain+=15; tTotal=Math.max(tTotal,tRemain); drawTimer(); };
    document.getElementById('timerStop').onclick=function(){ clearInterval(tInterval); overlay.classList.remove('show'); };
    function vibrate(){ if(navigator.vibrate) navigator.vibrate([200,100,200,100,300]); }
    function beep(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)();
      [0,.25,.5].forEach(d=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination);
        o.frequency.value=880; o.type='sine'; g.gain.setValueAtTime(.0001, ctx.currentTime+d);
        g.gain.exponentialRampToValueAtTime(.3, ctx.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+d+.2);
        o.start(ctx.currentTime+d); o.stop(ctx.currentTime+d+.22); }); }catch(e){} }

    /* ---------- CONFIGURAÇÕES ---------- */
    const sheetWrap=document.getElementById('sheetWrap');
    function buildSheet(){
      const t=getTheme();
      const sw=document.getElementById('swatches'); sw.innerHTML='';
      Object.keys(THEMES).forEach(name=>{
        const c=THEMES[name]; const el=document.createElement('div');
        el.className='swatch'+(t.accent===name?' sel':''); el.style.background=c.red;
        el.style.boxShadow='0 0 14px -2px '+c.glow; el.title=name;
        el.onclick=()=>{ const cur=getTheme(); cur.accent=name; store.set('theme',cur); applyTheme(); buildSheet(); };
        sw.appendChild(el);
      });
      document.getElementById('modeDark').classList.toggle('sel', t.mode!=='light');
      document.getElementById('modeLight').classList.toggle('sel', t.mode==='light');
    }
    document.getElementById('gearBtn').onclick=function(){ buildSheet(); sheetWrap.classList.add('show'); };
    document.getElementById('sheetClose').onclick=function(){ sheetWrap.classList.remove('show'); };
    sheetWrap.onclick=function(e){ if(e.target===sheetWrap) sheetWrap.classList.remove('show'); };
    document.getElementById('modeDark').onclick=function(){ const t=getTheme(); t.mode='dark'; store.set('theme',t); applyTheme(); buildSheet(); };
    document.getElementById('modeLight').onclick=function(){ const t=getTheme(); t.mode='light'; store.set('theme',t); applyTheme(); buildSheet(); };

    /* ---------- ROTEAMENTO ---------- */
    window.__openTreino=id=>{ location.hash='#/'+id; };
    backBtn.onclick=()=>{ const h=location.hash; if(h.match(/#\/[A-Z]/)||h==='#/hist') location.hash=''; else location.hash=''; };
    function route(){
      sheetWrap.classList.remove('show'); overlay.classList.remove('show'); clearInterval(tInterval);
      const h=location.hash;
      if(h==='#/hist'){ renderHistory(); return; }
      const m=h.match(/#\/([A-Za-z0-9]+)/);
      if(m && TREINOS.find(x=>x.id===m[1])) renderTreino(m[1]); else renderHome();
    }
    window.addEventListener('hashchange', route);

    applyTheme();
    route();
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  })();
  </script>
</body>
</html>
