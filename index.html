<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Meus Treinos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script>try{var _t=JSON.parse(localStorage.getItem('treino_theme')||'{}');if(_t.mode==='light')document.documentElement.setAttribute('data-mode','light');}catch(e){}</script>
<style>
:root{
  --bg:#0a0a0b; --bg2:#0f0f11; --card:#131316; --card2:#1b1b1f; --card3:#24242a; --line:#2a2a30;
  --txt:#f2f2f4; --muted:#8f8f98; --faint:#5f5f68;
  --red:#e10600; --red2:#ff2a1f; --redglow:rgba(225,6,0,.45); --redtint:rgba(225,6,0,.12); --redline:rgba(225,6,0,.30);
  --forca:#ff453a; --corrida:#3b8fe0; --ok:#22c55e; --warn:#ffb648;
  --radius:16px; --nav-h:66px;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
}
:root[data-mode="light"]{
  --bg:#eceef3; --bg2:#e3e6ee; --card:#ffffff; --card2:#f1f3f8; --card3:#e6e9f0; --line:#d7dbe4;
  --txt:#16171c; --muted:#5f6573; --faint:#9aa0ad; --forca:#d70f0a; --corrida:#1f6fd6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 55% at 50% -10%,var(--redtint),transparent 60%),radial-gradient(70% 45% at 100% 100%,rgba(59,143,224,.07),transparent 60%)}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}

/* ===== header ===== */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:58px}
.icon-btn{background:var(--card2);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{background:var(--red);border-color:var(--red)}
#backBtn{display:none;font-size:24px}
header h1{font-family:var(--head);font-size:20px;margin:0;font-weight:700;flex:1;line-height:1.05;text-transform:uppercase;letter-spacing:1px}
header h1 small{display:block;font-family:-apple-system,sans-serif;font-size:10.5px;color:var(--red2);font-weight:800;letter-spacing:2px;margin-top:3px}
main{padding:16px;max-width:640px;margin:0 auto}
main>*{animation:sobe .45s cubic-bezier(.2,.9,.25,1) backwards}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}main>*:nth-child(6){animation-delay:.25s}main>*:nth-child(n+7){animation-delay:.3s}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== nav ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;position:relative}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.nav button.on{color:var(--red2)}
.nav button.on svg{transform:translateY(-2px);filter:drop-shadow(0 0 8px var(--redglow))}
.nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--red2);box-shadow:0 0 12px var(--redglow)}

/* ===== básicos ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.label{font-size:11px;letter-spacing:2.5px;color:var(--muted);font-weight:800;text-transform:uppercase;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.label:first-child{margin-top:4px}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
.h2{font-family:var(--head);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.5px;line-height:1;margin:0}
.muted{color:var(--muted)}.small{font-size:12.5px}
.btn{width:100%;background:linear-gradient(135deg,var(--red2),var(--red));border:none;color:#fff;border-radius:13px;padding:15px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;box-shadow:0 8px 24px -10px var(--redglow);font-family:var(--head)}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none;font-size:13px}
.btn.blue{background:linear-gradient(135deg,#4aa0ff,#1f6fd6);box-shadow:0 8px 24px -10px rgba(59,143,224,.6)}
.row{display:flex;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.pill.red{color:var(--red2);background:var(--redtint);border-color:var(--redline)}
.pill.blue{color:#6fb0ff;background:rgba(59,143,224,.12);border-color:rgba(59,143,224,.35)}
.pill.gold{color:#ffc24a;background:rgba(255,194,74,.12);border-color:rgba(255,194,74,.35)}
.pill.ok{color:var(--ok);background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:15px;color:var(--txt)}
.inp:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--redtint)}
.field{margin-bottom:12px}
.field label{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px;line-height:1.6}

/* ===== HOJE ===== */
.hello{padding:6px 2px 14px}
.hello small{font-size:11px;font-weight:800;letter-spacing:2.4px;color:var(--red2)}
.hello h2{font-family:var(--head);font-size:34px;line-height:1;margin:4px 0 0;text-transform:uppercase}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ring{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 8px 12px;text-align:center}
.ring svg{width:74px;height:74px;display:block;margin:0 auto 6px}
.ring b{display:block;font-family:var(--head);font-size:13px;letter-spacing:.8px;text-transform:uppercase}
.ring span{font-size:11px;color:var(--muted)}
.next{display:flex;gap:14px;align-items:center;cursor:pointer}
.badge{width:58px;height:58px;border-radius:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:28px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--red2),color-mix(in srgb,var(--red) 55%,#000));box-shadow:0 0 22px -6px var(--redglow)}
.badge.run{background:linear-gradient(135deg,#4aa0ff,#13407e);box-shadow:0 0 22px -6px rgba(59,143,224,.6);font-size:24px}
.next .info{flex:1;min-width:0}
.next h3{margin:0;font-family:var(--head);font-size:19px;text-transform:uppercase;letter-spacing:.4px}
.next p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.next .go{font-size:26px;color:var(--red2)}
.aviso{margin-top:12px;font-size:12.5px;line-height:1.45;color:var(--warn);background:rgba(255,182,72,.08);border:1px solid rgba(255,182,72,.25);border-radius:10px;padding:9px 11px}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 2px 7px;text-align:center;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.dia .n{display:block;font-family:var(--head);font-size:17px;color:var(--txt);margin:2px 0 4px}
.dia .ic{display:flex;justify-content:center;gap:3px;min-height:9px}
.dia .ic i{width:8px;height:8px;border-radius:50%}
.dia.hoje{border-color:var(--red);box-shadow:0 0 14px -6px var(--redglow)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.macros div b{display:block;font-family:var(--head);font-size:20px}
.macros div span{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.8px;text-transform:uppercase}

/* ===== FORÇA ===== */
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);background:#050506;min-height:210px;display:flex;align-items:flex-end}
.hero svg.arte{position:absolute;inset:0;width:100%;height:100%}
.hero .ct{position:relative;padding:18px}
.hero .kick{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:2.4px;color:#fff;background:var(--red);padding:4px 10px;border-radius:6px;text-transform:uppercase;margin-bottom:9px}
.hero h2{font-family:var(--head);margin:0;font-size:36px;line-height:.95;color:#fff;text-transform:uppercase;text-shadow:0 2px 20px rgba(0,0,0,.7)}
.hero h2 b{color:var(--red2)}
.hero p{margin:6px 0 0;font-size:12.5px;color:#d4d4da;font-weight:600}
.tcard{display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .12s,border-color .2s}
.tcard:active{transform:scale(.985);border-color:var(--red)}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.tcard .badge{margin-left:4px}
.tcard .info{flex:1;min-width:0}
.tcard h3{margin:0;font-family:var(--head);font-size:19px;text-transform:uppercase;letter-spacing:.3px}
.tcard p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tcard .st{font-size:11px;font-weight:800;letter-spacing:.8px;margin-top:6px;text-transform:uppercase;color:var(--red2)}
.tcard .st.ok{color:var(--ok)}.tcard .st.m{color:var(--muted)}
.tcard.sug{border-color:var(--redline);box-shadow:0 0 30px -14px var(--redglow)}
.regras li{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:6px}
.regras li b{color:var(--txt)}

.progress-wrap{margin-bottom:16px}
.progress-top{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.progress-top b{color:var(--red2)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:99px;transition:width .4s;box-shadow:0 0 12px -1px var(--redglow)}
.bar.blue>div{background:linear-gradient(90deg,#1f6fd6,#5aa8ff);box-shadow:0 0 12px -1px rgba(59,143,224,.6)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;transition:border-color .2s}
.ex.done{border-color:var(--red)}
.ex-media{width:100%;aspect-ratio:16/11;background:#fff;position:relative;overflow:hidden}
.ex-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.ex-media .f1{opacity:0}.ex-media .f1.anim{animation:exflip 1.6s linear infinite}
@keyframes exflip{0%,48%{opacity:0}52%,100%{opacity:1}}
.ex-media .dot{position:absolute;bottom:8px;right:10px;font-size:10px;color:#fff;font-weight:800;background:var(--red);padding:3px 8px;border-radius:99px}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:var(--card2)}
.ex-body{padding:15px}
.ex-head{display:flex;justify-content:space-between;gap:10px}
.ex-head h3{margin:0;font-size:16px;line-height:1.3;font-weight:800}
.ex-meta{display:flex;gap:20px;margin:12px 0}
.ex-meta span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.ex-meta strong{font-size:18px;font-family:var(--head)}
.obs{font-size:12.5px;color:var(--muted);background:var(--card2);border-left:2px solid var(--red);border-radius:8px;padding:10px 12px;margin:0 0 12px;line-height:1.45}
.carga{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.carga label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}
.carga input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700;min-width:0}
.lastload{font-size:11.5px;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lastload .up{color:var(--ok);font-weight:800}.lastload .down{color:var(--red2);font-weight:800}
.series{display:flex;gap:7px;margin-bottom:12px}
.serie-btn{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:11px 2px;font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase;transition:.15s}
.serie-btn .n{font-size:16px;color:var(--txt);font-family:var(--head)}
.serie-btn.done{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 16px -4px var(--redglow)}
.serie-btn.done .n{color:#fff}
.serie-btn.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
.rest-btn{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:13px;font-size:13.5px;font-weight:800;text-transform:uppercase}

/* ===== CORRIDA ===== */
.fase{display:flex;justify-content:space-between;align-items:center;gap:10px}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav button{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:18px}
.sess{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:none;padding-bottom:2px}
.sess .tag{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#4aa0ff,#13407e)}
.sess .tag.q{background:linear-gradient(135deg,#ff6b5a,#8a1208)}
.sess .tag.t{background:linear-gradient(135deg,#ffb648,#8a5208)}
.sess .tag.long,.sess .tag.teste{background:linear-gradient(135deg,#a86bff,#3d1a7a)}
.sess .bd{flex:1;min-width:0}
.sess h4{margin:0;font-family:var(--head);font-size:17px;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess .quando{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.sess .pr{font-size:14px;line-height:1.45;margin:7px 0 4px;font-weight:600}
.sess .pr b{color:#6fb0ff}
.sess .ext{font-size:12px;color:var(--muted);line-height:1.45}
.sess .acts{display:flex;gap:8px;margin-top:10px}
.sess .acts button{padding:8px 12px;border-radius:9px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;background:var(--card2);border:1px solid var(--line)}
.sess .acts .reg{background:rgba(59,143,224,.14);border-color:rgba(59,143,224,.4);color:#6fb0ff}
.sess.done .tag{background:linear-gradient(135deg,#22c55e,#0e5a2a)}
.zonas{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.zonas div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 2px}
.zonas b{display:block;font-family:var(--head);font-size:16px}
.zonas span{font-size:9.5px;color:var(--muted);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.runrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.runrow:last-child{border-bottom:none}
.runrow .d{width:46px;font-size:11px;font-weight:800;color:var(--muted)}
.runrow .k{flex:1}
.runrow .k b{font-family:var(--head);font-size:18px}
.runrow .p{text-align:right;font-size:12px;color:var(--muted)}
.runrow .p b{display:block;color:var(--txt);font-size:14px}
.runrow button{background:none;border:none;color:var(--faint);font-size:16px}

/* ===== DIETA ===== */
.meta-k{display:flex;align-items:baseline;gap:8px}
.meta-k b{font-family:var(--head);font-size:44px;line-height:1}
.macrobar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 8px;gap:2px}
.macrobar i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.meal{cursor:pointer}
.meal-h{display:flex;align-items:center;gap:12px}
.meal-h .ico{width:42px;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.meal-h .t{flex:1}
.meal-h h3{margin:0;font-family:var(--head);font-size:17px;text-transform:uppercase}
.meal-h p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.meal-h .kc{text-align:right;font-family:var(--head);font-size:17px}
.meal-h .kc span{display:block;font-family:-apple-system,sans-serif;font-size:10.5px;color:var(--muted);font-weight:700}
.meal ul{list-style:none;margin:12px 0 0;padding:0}
.meal li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px}
.meal li b{font-weight:800;white-space:nowrap}
.meal .mx{display:none;margin-top:10px}
.meal.open .mx{display:block}
.meal .tr{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.meal .tr b{color:var(--txt)}
.compra{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.compra:last-child{border-bottom:none}
.compra .n{flex:1}
.compra .n small{display:block;color:var(--muted);font-size:11.5px}
.compra input{width:74px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px;text-align:right;font-size:13px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px}
.total b{font-family:var(--head);font-size:30px}

/* ===== EVOLUÇÃO / GRÁFICOS ===== */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:10px;fill:var(--muted);font-family:-apple-system,sans-serif}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.mk,.chart .sel{opacity:1}
.tt{position:absolute;z-index:5;pointer-events:none;background:var(--card3);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translate(-50%,-110%);transition:opacity .12s;white-space:nowrap}
.tt.on{opacity:1}
.tt b{font-family:var(--head);font-size:14px}
.tt i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ctitle h3{margin:0;font-family:var(--head);font-size:17px;text-transform:uppercase;letter-spacing:.4px}
.ctitle span{font-size:12px;color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi small{display:block;font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.kpi b{display:block;font-family:var(--head);font-size:24px;margin-top:3px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--card2)}
.heat i.f{background:var(--forca)}.heat i.c{background:var(--corrida)}
.heat i.fc{background:linear-gradient(135deg,var(--forca) 50%,var(--corrida) 50%)}
.heat i.x{background:transparent}.heat i.h{outline:2px solid var(--txt);outline-offset:1px}
.tabela{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.tabela td,.tabela th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.tabela th{color:var(--muted);font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.tabela td:first-child,.tabela th:first-child{text-align:left}
details summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:700;margin-top:8px}

/* ===== timer / sheets / toast ===== */
.overlay{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--bg) 93%,#000);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px}
.overlay.show{display:flex}
.timer-ring{position:relative;width:240px;height:240px;filter:drop-shadow(0 0 24px var(--redglow))}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:700;font-family:var(--head)}
.timer-label{color:var(--muted);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:2px;text-align:center}
.timer-actions{display:flex;gap:10px}
.timer-actions button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 20px;font-size:14px;font-weight:800;text-transform:uppercase}
.timer-actions .primary{background:var(--red);border-color:var(--red);color:#fff}
.sheet-wrap{position:fixed;inset:0;z-index:110;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet-wrap.show{display:flex}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);animation:slideup .25s cubic-bezier(.2,.9,.25,1)}
@keyframes slideup{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-family:var(--head);font-size:22px;text-transform:uppercase}
.sheet .sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}
.swatches{display:flex;gap:12px}
.swatch{width:42px;height:42px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.swatch.sel{border-color:var(--txt)}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 6px;font-size:13px;font-weight:800}
.seg button.sel{border-color:var(--red);background:var(--redtint);color:var(--red2)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--red);padding:13px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ===== ABERTURA ===== */
.splash{position:fixed;inset:0;z-index:1000;background:#050506;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.splash::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 42%,var(--redglow),transparent 45%);opacity:0;animation:spGlow 1.4s .2s ease-out forwards}
@keyframes spGlow{to{opacity:.9}}
.splash.out{animation:spOut .55s ease forwards}
@keyframes spOut{to{opacity:0;visibility:hidden;transform:scale(1.06)}}
.sp-bar{position:relative;width:min(82vw,360px);height:140px}
.sp-bar svg{width:100%;height:100%;overflow:visible}
.sp-bar .haste{stroke-dasharray:300;stroke-dashoffset:300;animation:traco .5s .25s ease-out forwards}
@keyframes traco{to{stroke-dashoffset:0}}
.sp-bar .pl{opacity:0;animation:anilha .45s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes anilha{from{opacity:0;transform:translateX(var(--dx))}to{opacity:1;transform:none}}
.sp-bar .lift{animation:levanta 1s 1.35s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes levanta{40%{transform:translateY(8px)}100%{transform:translateY(-14px)}}
.sp-pista{width:min(82vw,360px);height:24px;margin-top:6px}
.sp-pista path{stroke-dasharray:420;stroke-dashoffset:420;animation:traco 1.1s 1.1s ease-in-out forwards}
.sp-pista circle{opacity:0;animation:corre 1.1s 1.1s ease-in-out forwards;offset-path:path('M4 12 L356 12')}
@keyframes corre{0%{opacity:1;offset-distance:0%}100%{opacity:1;offset-distance:100%}}
.sp-tit{font-family:var(--head);font-weight:700;font-size:clamp(44px,15vw,72px);line-height:.9;text-transform:uppercase;color:#fff;margin-top:18px;letter-spacing:1px;display:flex}
.sp-tit span{display:inline-block;opacity:0;animation:slam .5s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:calc(1.55s + var(--i)*55ms)}
.sp-tit span.r{color:var(--red2)}
@keyframes slam{from{opacity:0;transform:scale(2.2) translateY(-10px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.sp-tags{display:flex;gap:10px;margin-top:14px;font-size:11.5px;font-weight:800;letter-spacing:2.5px}
.sp-tags span{opacity:0;animation:fadeup .5s forwards}
.sp-tags span:nth-child(1){color:var(--forca);animation-delay:2.2s}
.sp-tags span:nth-child(2){color:#5aa8ff;animation-delay:2.4s}
.sp-tags span:nth-child(3){color:#ffc24a;animation-delay:2.6s}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sp-stats{display:flex;gap:28px;margin-top:28px;opacity:0;animation:fadeup .6s 2.7s forwards}
.sp-stats div{text-align:center}
.sp-stats b{display:block;font-family:var(--head);font-size:30px;color:#fff}
.sp-stats small{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#8f8f98}
.sp-skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));font-size:10px;letter-spacing:2px;color:#5f5f68;font-weight:800}

/* ===== APRESENTAÇÃO (primeiro uso) ===== */
.onb{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column}
.onb .slides{flex:1;position:relative;overflow:hidden}
.onb .sl{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 40px) 26px 20px;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateX(40px);transition:opacity .45s,transform .45s cubic-bezier(.2,.9,.25,1);pointer-events:none;overflow-y:auto}
.onb .sl.on{opacity:1;transform:none;pointer-events:auto}
.onb .sl.prev{transform:translateX(-40px)}
.onb .big{font-size:64px;margin-bottom:12px}
.onb h2{font-family:var(--head);font-size:40px;line-height:.95;text-transform:uppercase;margin:0 0 14px}
.onb h2 b{color:var(--red2)}
.onb p{font-size:15.5px;line-height:1.6;color:var(--muted);margin:0 0 10px}
.onb p b{color:var(--txt)}
.onb .feat{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.onb .feat span{font-size:22px}
.onb .foot{padding:14px 22px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:6px;flex:1}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:.3s}
.dots i.on{width:26px;background:var(--red2)}
.onb .foot .btn{width:auto;padding:14px 26px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="backBtn" aria-label="Voltar">‹</button>
  <h1 id="title">Meus Treinos<small id="subtitle">Sem modo fácil</small></h1>
  <button class="icon-btn" id="gearBtn" aria-label="Configurações">⚙</button>
</header>
<main id="app"></main>

<nav class="nav" id="nav">
  <button data-r="hoje"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoje</button>
  <button data-r="forca"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Força</button>
  <button data-r="corrida"><svg viewBox="0 0 24 24"><circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 3v4M6 12l3-4 4 1 3 4 3 1"/></svg>Corrida</button>
  <button data-r="dieta"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>Dieta</button>
  <button data-r="evolucao"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>Evolução</button>
</nav>

<div class="overlay" id="timerOverlay">
  <div class="timer-ring"><svg width="240" height="240"><circle cx="120" cy="120" r="108" fill="none" stroke="var(--card2)" stroke-width="14"/><circle id="timerCircle" cx="120" cy="120" r="108" fill="none" stroke="var(--red)" stroke-width="14" stroke-linecap="round"/></svg><div class="num" id="timerNum">0:00</div></div>
  <div class="timer-label" id="timerLabel">Descanso</div>
  <div class="timer-actions"><button id="timerAdd">+15s</button><button class="primary" id="timerToggle">Pausar</button><button id="timerStop">Encerrar</button></div>
</div>

<script src="app.js"></script>
